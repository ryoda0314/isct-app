<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>だんだん PBC 2026 ピッチ</title>
<!--
  PBC 2026 の5分ピッチ（日英併記）: だんだん（仮称）＝ Science Tokyo App のキャンパスナビ 3D を、ひとつのアプリとして独立させる提案。
  課題 → 気づき → アイデア → アプリ（歩く・作る）→ いまの状態 → PBCでやること → 進め方 → チーム（ひとり・募集中）→ おわり（QR）。
  再生のしくみは ことのあめ_PBC2026ピッチ と同じ（1枚が1場面、render(t) で t 秒目を描き、stops ごとに待つ）。
  操作: → / スペース / クリックで次へ、← / 左端クリックで戻る、F 全画面、N 発表メモ、Home 最初から。
  地図の絵は本物のデータ: 国土地理院 DEM5A の等高線（1m）、OpenStreetMap の建物、アプリと同じ経路の網で引いた Taki Plaza → 体育館 のルート、
  /editor/3d で手で足した階段。画面はアプリ（デモ）とエディタから撮ったもの。数字は 2026-10-21 時点の isct リポジトリから数えた
  （建物 127、スポット 158、経路の網 733 本、手で足した構造物 11、OSM の候補 165、キャンパスの標高 18.0〜38.7m）。
  名前を変えるときは NAME / NAME_KANJI と <title> だけ。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Overpass+Mono:wght@400;600&family=Overpass:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
<style>
/* Layout: a 1920×1080 stage scaled into the window. Every slide makes its point with a picture drawn from the campus's own
   data (contour lines, buildings, the route, the stairs); the heading is Japanese with an English line under it.
   One light look on purpose, a map on paper for a projector: ink, the app's route blue for the way, and the brown of
   contour lines for height. Type: a UD signage face for Japanese, Overpass (after the highway-sign face) for English
   and numbers, its mono for elevations. */
:root {
  --paper: #f3f5f0;
  --surface: #e7ebe4;
  --ink: #1b262d;
  --ink-2: #394851;
  --muted: #5a6870;
  --faint: #8e999f;
  --line: #dce2db;
  --line-2: #c5cec6;
  --route: #1a8ef0;
  --route-ink: #0b65bd;
  --route-tint: #e1eefb;
  --route-halo: rgba(26, 142, 240, 0.2);
  --contour: #b67641;
  --contour-ink: #8a4e1e;
  --contour-tint: #f3e6d6;
  --terrain: #e3e9da;
  --building: #dfe4de;
  --building-edge: #b5bfb6;
  --shadow: rgba(27, 38, 45, 0.28);
  --on-accent: #ffffff;

  --font-ja: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-head: "Zen Kaku Gothic New", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-en: "Overpass", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Overpass Mono", "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
body { -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; cursor: default; }
#viewport {
  position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--paper);
}
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
  background: var(--paper); color: var(--ink); font-family: var(--font-ja); word-break: auto-phrase; line-break: strict;
}
#tick { position: fixed; inset: 0; pointer-events: none; background: var(--paper); opacity: 0.001; will-change: opacity; }
.scene { position: absolute; inset: 0; overflow: hidden; }
.inner { position: absolute; inset: 0; will-change: transform, opacity; }

#ui { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
#prog { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--surface); }
#progFill { position: absolute; inset: 0; background: var(--route); transform-origin: 0 50%; transform: scaleX(0); transition: transform 0.5s ease; }
#pageNo { position: absolute; right: 48px; bottom: 24px; font: 600 20px var(--font-mono); color: var(--faint); }
#hint { position: absolute; left: 48px; bottom: 24px; font-size: 20px; color: var(--muted); transition: opacity 1s; }
#loading { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--paper); font-size: 30px; font-weight: 700; color: var(--muted); }
#notesBar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; max-height: 40%; overflow: auto;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--paper); border-top: 1px solid var(--line-2); color: var(--ink); font: 400 16px/1.7 var(--font-ja);
}
#notesBar b { display: block; font-size: 13px; color: var(--muted); }

.en { font-family: var(--font-en); }
.mono { font-family: var(--font-mono); }
.abs { position: absolute; }
.v { will-change: transform, opacity; }
.ov { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
.ov path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; }
.ic { display: block; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }

/* A slide's heading: the part of the talk, the Japanese title, its English. The kicker's mark is a short piece of route. */
.head { position: absolute; left: 120px; top: 68px; width: 1680px; }
.kick { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 700; color: var(--route-ink); letter-spacing: 0.04em; white-space: nowrap; }
.kick::before { content: ""; width: 30px; height: 6px; border-radius: 3px; background: var(--route); }
.title { margin: 12px 0 0; font-family: var(--font-head); font-size: 58px; line-height: 1.25; font-weight: 700; white-space: nowrap; }
.en-t { margin: 6px 0 0; font-family: var(--font-en); font-size: 28px; line-height: 1.3; font-weight: 500; color: var(--muted); white-space: nowrap; }
.label { font-size: 24px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; white-space: nowrap; }
.label .en { font-weight: 500; letter-spacing: 0; }
cite { display: block; margin: 0; font-style: normal; font-family: var(--font-en); font-size: 20px; line-height: 1.5; color: var(--muted); white-space: nowrap; }

/* Title and the end: the name climbs like stairs over the campus's contour lines. */
.wm { position: absolute; margin: 0; font-family: var(--font-head); font-weight: 900; font-size: 150px; line-height: 1; white-space: nowrap; }
.treads { stroke: var(--contour); stroke-width: 6; }
.kanji { font-family: var(--font-head); font-weight: 700; font-size: 34px; letter-spacing: 0.24em; color: var(--muted); white-space: nowrap; }
.lead { margin: 0; font-size: 44px; line-height: 1.5; font-weight: 700; white-space: nowrap; }
.lead-en { margin: 0; font-family: var(--font-en); font-size: 32px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.mapcap { font-family: var(--font-mono); font-size: 18px; line-height: 1.6; color: var(--muted); white-space: nowrap; text-align: right; }
.tag { display: flex; align-items: baseline; gap: 10px; padding: 6px 14px; border-radius: 10px; background: var(--paper); box-shadow: 0 0 0 2px var(--line-2); white-space: nowrap; }
.tag b { font-size: 24px; font-weight: 700; }
.tag span { font-size: 19px; font-weight: 600; color: var(--contour-ink); }
.endq { margin: 0; font-family: var(--font-head); font-size: 84px; line-height: 1.3; font-weight: 700; white-space: nowrap; }
.ende { margin: 0; font-family: var(--font-en); font-size: 44px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.cta { margin: 0; font-size: 30px; font-weight: 700; color: var(--route-ink); white-space: nowrap; }
.cta small { display: block; margin-top: 4px; font-family: var(--font-en); font-size: 24px; font-weight: 500; color: var(--muted); }
.trycard { box-sizing: border-box; border-radius: 30px; background: var(--paper); box-shadow: 0 0 0 2px var(--line-2), 0 40px 70px -40px var(--shadow); }
.qrcard { box-sizing: border-box; width: 340px; height: 340px; padding: 24px; color: var(--ink); }
.qrcard svg { display: block; width: 100%; height: 100%; }
.qrl { width: 340px; text-align: center; font-size: 26px; font-weight: 700; color: var(--route-ink); white-space: nowrap; }
.qrl small { display: block; margin-top: 2px; font-family: var(--font-en); font-size: 20px; font-weight: 500; color: var(--muted); }
.url { width: 380px; text-align: center; font-family: var(--font-en); font-size: 26px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.how { width: 380px; text-align: center; font-size: 22px; line-height: 1.55; color: var(--muted); }
.how b { color: var(--ink); }
.sign { position: absolute; }
.sign .wm { font-size: 56px; }

/* Problem: the same walk from above and from the side. */
.mapcard { box-sizing: border-box; border: 2px solid var(--line-2); border-radius: 20px; background: var(--paper); overflow: hidden; }
.pill { padding: 6px 16px; border-radius: 999px; background: var(--route); color: var(--on-accent); font: 700 26px var(--font-en); white-space: nowrap; }
.pill small { font-family: var(--font-ja); font-size: 22px; font-weight: 700; margin-left: 2px; }
.chart text { font-family: var(--font-mono); font-size: 18px; fill: var(--muted); }
.chart .ja { font-family: var(--font-ja); font-size: 20px; font-weight: 700; fill: var(--ink-2); }
.chart .grid { stroke: var(--line); stroke-width: 2; }
.chart .base { stroke: var(--ink-2); stroke-width: 3; stroke-linecap: round; }
.chart .flat { fill: none; stroke: var(--route); stroke-width: 4; stroke-dasharray: 10 9; stroke-linecap: round; }
.chart .prof { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.chart .stp { fill: none; stroke: var(--contour); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.chart .area { fill: var(--terrain); }
.chart .dim { fill: none; stroke: var(--contour-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart .dot { fill: var(--paper); stroke: var(--ink); stroke-width: 4; }
.chart .big { font-family: var(--font-en); font-size: 46px; font-weight: 700; fill: var(--contour-ink); }
.chart .big2 { font-family: var(--font-ja); font-size: 24px; font-weight: 700; fill: var(--contour-ink); }
.chart .sm-en { font-family: var(--font-en); font-size: 18px; fill: var(--muted); }
.chart .flat-l { font-family: var(--font-ja); font-size: 22px; font-weight: 700; fill: var(--route-ink); }

/* Insight: a crossing seen from above, then tilted to show it is a bridge. */
.tilt { perspective: 2400px; perspective-origin: 50% 0%; }
.plane { position: absolute; transform-style: preserve-3d; transform-origin: 50% 50%; }
.plane > * { position: absolute; box-sizing: border-box; }
.gnd { left: 0; top: 0; width: 100%; height: 100%; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line-2); }
.road { background: var(--paper); box-shadow: inset 0 0 0 2px var(--line-2); }
.dshadow { background: var(--line-2); opacity: 0; }
.pier { background: var(--building-edge); transform-origin: 50% 100%; }
.deck { background: var(--paper); box-shadow: inset 0 0 0 3px var(--ink-2); }
.deck i { position: absolute; top: 10px; bottom: 10px; width: 3px; background: var(--ink-2); opacity: 0.55; }
.rt { overflow: visible; }
.rt path { fill: none; stroke: var(--route); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
.rt .cs { stroke: var(--paper); stroke-width: 20; }
.say { position: absolute; padding: 16px 28px; background: var(--paper); border-radius: 26px 26px 26px 8px; box-shadow: 0 0 0 2px var(--line-2), 0 16px 30px -18px var(--shadow); font-size: 36px; line-height: 1.35; font-weight: 700; white-space: nowrap; will-change: transform, opacity; }
.say small { display: block; font-family: var(--font-en); font-size: 21px; font-weight: 500; color: var(--muted); }
.say.ans { color: var(--contour-ink); }
.rcard { box-sizing: border-box; padding: 40px 44px; border-radius: 24px; background: var(--surface); }
.rcard .big { margin: 14px 0 0; font-family: var(--font-head); font-size: 50px; line-height: 1.35; font-weight: 700; white-space: nowrap; }
.rcard .big-en { margin: 12px 0 0; font-family: var(--font-en); font-size: 25px; line-height: 1.45; color: var(--muted); }
.rcard cite { margin-top: 26px; }
.rcard .what { margin-top: 2px; font-size: 20px; color: var(--muted); white-space: nowrap; }

/* Idea: three layers of the same square of campus, stacked. */
.iso .face { stroke: var(--line-2); stroke-width: 2; }
.iso .f0 { fill: var(--terrain); }
.iso .f1 { fill: var(--paper); fill-opacity: 0.72; }
.iso .f2 { fill: var(--route-tint); fill-opacity: 0.35; stroke-dasharray: 8 7; }
.iso .c { fill: none; stroke: var(--contour); stroke-width: 1.2; opacity: 0.7; }
.iso .c5 { fill: none; stroke: var(--contour); stroke-width: 2.4; }
.iso .b { fill: var(--building); stroke: var(--building-edge); stroke-width: 1.2; }
.iso .st { fill: var(--contour-tint); stroke: var(--contour); stroke-width: 2; }
.iso .hatch { stroke: var(--contour); stroke-width: 1.4; }
.iso .tr { fill: none; stroke: var(--contour-ink); stroke-width: 2; stroke-dasharray: 6 6; }
.iso .rc { fill: none; stroke: var(--paper); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
.iso .rb { fill: none; stroke: var(--route); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.iso .lk { fill: none; stroke: var(--faint); stroke-width: 2; stroke-dasharray: 6 8; }
.lay { display: flex; gap: 22px; align-items: flex-start; }
.lay .no { flex: none; display: grid; place-items: center; width: 50px; height: 50px; box-sizing: border-box; border: 3px solid var(--route); border-radius: 50%; color: var(--route-ink); font: 700 24px var(--font-en); }
.lay.l1 .no, .lay.l0 .no { border-color: var(--contour); color: var(--contour-ink); }
.lay h3 { margin: 0; font-family: var(--font-head); font-size: 44px; line-height: 1.2; font-weight: 700; white-space: nowrap; }
.lay h3 small { margin-left: 14px; font-family: var(--font-en); font-size: 25px; font-weight: 500; color: var(--muted); }
.lay p { margin: 6px 0 0; font-size: 27px; line-height: 1.45; white-space: nowrap; }
.lay p.en { margin-top: 0; font-family: var(--font-en); font-size: 20px; color: var(--muted); }

/* The app on a phone, the editor in a window, and the steps beside them. */
.phone { position: absolute; box-sizing: border-box; padding: 12px; border: 3px solid var(--ink); border-radius: 60px; background: var(--paper); box-shadow: 0 40px 70px -40px var(--shadow); }
.screen { position: relative; width: 380px; height: 824px; overflow: hidden; border-radius: 47px; background: var(--paper); }
.screen img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; transform-origin: 55% 60%; }
.ring2 { position: absolute; border: 4px solid var(--contour); border-radius: 14px; opacity: 0; }
.step { display: flex; gap: 28px; align-items: flex-start; }
.step > .ic { flex: none; margin-top: 4px; color: var(--route); }
.step.warn > .ic { color: var(--contour); }
.step h3 { margin: 0; font-family: var(--font-head); font-size: 48px; line-height: 1.2; font-weight: 700; white-space: nowrap; }
.step h3 small { margin-left: 16px; font-family: var(--font-en); font-size: 26px; font-weight: 500; color: var(--muted); }
.step p { margin: 10px 0 0; font-size: 30px; line-height: 1.5; white-space: nowrap; }
.step p.en { margin-top: 0; font-family: var(--font-en); font-size: 22px; line-height: 1.4; color: var(--muted); }
.step.sm { gap: 20px; }
.step.sm h3 { font-size: 40px; }
.step.sm h3 small { font-size: 23px; margin-left: 12px; }
.step.sm p { font-size: 26px; margin-top: 8px; }
.step.sm p.en { font-size: 19px; }
.browser { position: absolute; box-sizing: border-box; border: 2px solid var(--line-2); border-radius: 18px; background: var(--paper); overflow: hidden; box-shadow: 0 40px 70px -40px var(--shadow); }
.bbar { height: 36px; display: flex; align-items: center; gap: 9px; padding: 0 16px; border-bottom: 2px solid var(--line); background: var(--surface); }
.bbar i { width: 12px; height: 12px; border-radius: 50%; background: var(--line-2); }
.bbar span { margin-left: 12px; padding: 2px 14px; border-radius: 8px; background: var(--paper); font: 500 16px var(--font-mono); color: var(--muted); }
.callout { position: absolute; box-sizing: border-box; border: 4px solid var(--route); border-radius: 14px; box-shadow: 0 0 0 6px var(--route-halo); opacity: 0; }
.cnum { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: var(--route); color: var(--on-accent); display: grid; place-items: center; font: 700 24px var(--font-en); opacity: 0; }
.cands { display: flex; gap: 10px; }
.cand { display: flex; align-items: baseline; gap: 8px; padding: 8px 14px; border: 2px solid var(--line-2); border-radius: 12px; background: var(--paper); white-space: nowrap; }
.cand b { font: 700 28px var(--font-en); }
.cand span { font-size: 21px; color: var(--ink-2); }

/* Status, plans, schedule, team. */
.stat .ic { color: var(--route); }
.stat.h .ic { color: var(--contour); }
.stat .num { margin-top: 8px; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.stat .num b { font-family: var(--font-en); font-size: 92px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.stat .num span { font-size: 32px; font-weight: 700; }
.stat small { display: block; margin-top: 8px; font-family: var(--font-en); font-size: 21px; color: var(--muted); white-space: nowrap; }
.chips { display: flex; gap: 12px; }
.chip { display: flex; flex-direction: column; padding: 10px 16px; border: 2px solid var(--line-2); border-radius: 14px; background: var(--paper); white-space: nowrap; }
.chip b { font-size: 25px; font-weight: 700; }
.chip small { font-family: var(--font-en); font-size: 17px; color: var(--muted); }
.honest { font-size: 30px; font-weight: 700; color: var(--contour-ink); white-space: nowrap; }
.honest small { display: block; font-family: var(--font-en); font-size: 21px; font-weight: 500; color: var(--muted); }
.tech { font-family: var(--font-en); font-size: 25px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.pcard { width: 520px; height: 520px; box-sizing: border-box; padding: 34px; border: 2px solid var(--line-2); border-radius: 22px; background: var(--paper); display: flex; flex-direction: column; }
.pcard .gfx { height: 280px; display: grid; place-items: center; }
.pcard h3 { margin: auto 0 0; font-family: var(--font-head); font-size: 38px; line-height: 1.3; font-weight: 700; white-space: nowrap; }
.pcard p { margin: 6px 0 0; font-size: 24px; line-height: 1.45; color: var(--ink-2); white-space: nowrap; }
.pcard p.en { margin-top: 2px; font-family: var(--font-en); font-size: 21px; color: var(--muted); }
.g svg text { font-family: var(--font-ja); }
.g .box { fill: var(--paper); stroke: var(--line-2); stroke-width: 3; }
.g .box2 { fill: var(--route-tint); stroke: var(--route); stroke-width: 3; }
.g .t1 { font-size: 22px; font-weight: 700; fill: var(--muted); }
.g .t2 { font-size: 30px; font-weight: 700; fill: var(--route-ink); }
.g .t3 { font-family: var(--font-en); font-size: 17px; fill: var(--muted); }
.g .t3j { font-family: var(--font-ja); font-size: 18px; fill: var(--muted); }
.g .arr { fill: none; stroke: var(--ink-2); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.g .stl { fill: none; stroke: var(--ink-2); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.g .ramp { fill: none; stroke: var(--route); stroke-width: 7; stroke-linecap: round; }
.g .no { fill: none; stroke: var(--contour); stroke-width: 7; stroke-linecap: round; }
.g .ok { fill: none; stroke: var(--route); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.g .wc { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.g .n1 { font-family: var(--font-en); font-size: 92px; font-weight: 700; fill: var(--contour-ink); }
.g .n2 { font-family: var(--font-en); font-size: 92px; font-weight: 700; fill: var(--route-ink); }
.g .nl { font-size: 22px; font-weight: 700; fill: var(--ink-2); }
.g .nle { font-family: var(--font-en); font-size: 17px; fill: var(--muted); }
.goal { display: flex; align-items: baseline; gap: 18px; font-size: 32px; font-weight: 700; white-space: nowrap; }
.goal b { padding: 4px 14px; border-radius: 10px; background: var(--route-tint); color: var(--route-ink); font-size: 26px; }
.goal small { font-family: var(--font-en); font-size: 22px; font-weight: 500; color: var(--muted); }

        const cand = c.pts.filter(([x, y]) => X(x) > o.w * 0.45 && X(x) < o.w - 40 && Y(y) > 40 && Y(y) < o.h - 40);

    const line = (pts, close) => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)))); if (close) ctx.closePath(); };

      canvas: cv,
      X: (x) => o.left + X(x), Y: (y) => o.top + Y(y),

        ctx.clearRect(0, 0, o.w, o.h);
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = COL.contour;
        for (const c of cont) {
          const a = p.contour ? p.contour(c.lev) : 0;
          if (a <= 0) continue;
          const major = c.lev % 5 === 0;
          ctx.globalAlpha = a * (major ? 0.95 : 0.5) * (p.contourAlpha ?? 1);

            const a = p.contour(l.lev) * (p.contourAlpha ?? 1);

            ctx.globalAlpha = a;
            ctx.lineWidth = 6;

          for (const b of bld) { line(b, true); ctx.fill(); ctx.stroke(); }

  await frame();
  await frame();
  await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 4000))]);
  for (const s of scenes) {
    s.def.render(0);
    s.box.style.display = "none";
    s.box.setAttribute("aria-hidden", "true");
  }
  loading.remove();

  // ---- Playback: each press plays on to the next stop ------------------------------------------------
  const N = scenes.length;
  const steps = [];
  scenes.forEach((s, i) => s.stops.forEach((p, k) => steps.push({ i, k, at: p.at, note: p.note })));
  const S = steps.length;
  let cur = 0, shown = -1, queue = [], segStart = 0, tickOn = false;
  const tickEl = document.getElementById("tick");
  function show(i) {
    if (shown === i) return;
    scenes.forEach((s, k) => { s.box.style.display = k === i ? "" : "none"; s.box.setAttribute("aria-hidden", k === i ? "false" : "true"); });
    shown = i;
  }
  // A slide's parts in .inner leave together, fading to the left, before the cut.
  function draw(i, t) {
    show(i);
    const s = scenes[i];
    s.def.render(t);
    const q = eio(seg(t, s.out, s.out + 0.45));
    s.inner.style.opacity = (1 - q).toFixed(3);
    s.inner.style.transform = q > 0 ? `translateX(${(-34 * q).toFixed(1)}px)` : "";
  }
  // One loop for the deck: it plays the queue and lets the shown slide keep its walker and rings moving while the deck
  // waits. While playing, an all but transparent layer changes every frame so the whole screen is redrawn (a still part
  // followed by a small change made some GPUs stall).
  function loop(now) {
    requestAnimationFrame(loop);
    if (queue.length) {
      if (!segStart) segStart = now;
      const [i, a, b] = queue[0];
      const t = a + (now - segStart) / 1000;
      if (t >= b) { draw(i, b); queue.shift(); segStart = now; }
      else draw(i, t);
      tickOn = !tickOn;
      tickEl.style.opacity = tickOn ? "0.0011" : "0.001";
      return;
    }
    const s = scenes[shown];
    if (s && s.def.idle) s.def.idle(now);
  }
  function play(run) { queue = run; segStart = 0; }
  function finish() {
    if (!queue.length) return;
    const [i, , b] = queue[queue.length - 1];
    queue = [];
    draw(i, b);
  }
  function go(k) {
    k = Math.max(0, Math.min(S - 1, k));
    queue = [];
    cur = k;
    draw(steps[k].i, steps[k].at);
    chrome();
  }
  function next() {
    if (queue.length) { finish(); return; }
    if (cur >= S - 1) return;
    hideHint();
    if (RM) { go(cur + 1); return; }
    const a = steps[cur], b = steps[cur + 1];
    if (a.i === b.i) play([[a.i, a.at, b.at]]);
    else play([[a.i, a.at, scenes[a.i].dur], [b.i, 0, b.at]]);
    cur += 1;
    chrome();
  }
  function back() { finish(); go(cur - 1); }
  function chrome() {
    document.getElementById("progFill").style.transform = `scaleX(${S > 1 ? cur / (S - 1) : 1})`;
    document.getElementById("pageNo").textContent = `${steps[cur].i + 1} / ${N}`;
    renderNotes();
  }
  const hint = document.getElementById("hint");
  hint.textContent = matchMedia("(pointer: coarse)").matches ? "タップで次へ　左端で戻る" : "→ / クリックで次へ　F 全画面　N 発表メモ";
  function hideHint() { hint.style.opacity = 0; }
  setTimeout(hideHint, 9000);

  addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter" || k === "ArrowDown") { e.preventDefault(); next(); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace" || k === "ArrowUp") { e.preventDefault(); back(); }
    else if (k === "Home") { go(0); if (!RM) play([[0, 0, steps[0].at]]); }
    else if (k === "End") go(S - 1);
    else if (k === "f" || k === "F") { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else document.documentElement.requestFullscreen().catch(() => {}); }
    else if (k === "n" || k === "N") openNotes();
  });
  vp.addEventListener("click", (e) => { if (e.target.closest("#notesBar")) return; if (e.clientX < innerWidth * 0.2) back(); else next(); });

  // ---- Talk track: a second window, or a strip under the slide where windows cannot open -----------
  let notesWin = null, startedAt = 0;
  const bar = document.getElementById("notesBar");
  function openNotes() {
    let w = null;
    try { w = window.open("", "pbc-dandan-notes", "width=640,height=760"); } catch (err) { w = null; }
    if (!w) { bar.hidden = !bar.hidden; renderNotes(); return; }
    notesWin = w;
    const d = w.document;
    d.open();
    d.write(`<!doctype html><html lang="ja"><meta charset="utf-8"><title>発表メモ</title>
<style>body{margin:0;padding:28px 32px;font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;color:#1b262d;background:#f3f5f0}
#p{font-size:15px;color:#5a6870;font-weight:700}#n{font-size:26px;line-height:1.7;margin-top:10px}
#x{font-size:16px;line-height:1.7;color:#5a6870;margin-top:24px;border-top:1px solid #dce2db;padding-top:14px}
#tm{position:fixed;right:28px;top:24px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.k{position:fixed;left:32px;bottom:20px;font-size:13px;color:#5a6870}</style>
<div id="p"></div><div id="tm">0:00</div><div id="n"></div><div id="x"></div><div class="k">← → でこちらからも進めます</div>`);
    d.close();
    d.addEventListener("keydown", (e) => {
      if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
      if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); back(); }
    });
    renderNotes();
  }
  function renderNotes() {
    const st = steps[cur], sc = scenes[st.i];
    const where = `${st.i + 1} / ${N}　${sc.name}` + (sc.stops.length > 1 ? `（${st.k + 1}/${sc.stops.length}）` : "");
    if (cur > 0 && !startedAt) startedAt = Date.now();
    if (!bar.hidden) {
      bar.textContent = "";
      const b = document.createElement("b");
      b.textContent = where;
      bar.append(b, st.note);
    }
    if (!notesWin || notesWin.closed) return;
    const d = notesWin.document;
    if (!d.getElementById("n")) return;
    d.getElementById("p").textContent = where;
    d.getElementById("n").textContent = st.note;
    d.getElementById("x").textContent = cur + 1 < S ? `次：${steps[cur + 1].note}` : "おわり";
  }
  setInterval(() => {
    if (!notesWin || notesWin.closed || !startedAt) return;
    const s = Math.floor((Date.now() - startedAt) / 1000);
    const n = notesWin.document.getElementById("tm");
    if (n) n.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 500);

  // For checks: draw(i, t) shows scene i at its second t; go(k) shows stop k.
  window.__deck = {
    next, go, draw, get cur() { return cur; }, get playing() { return queue.length > 0; },
    scenes: scenes.map((s) => ({ id: s.def.id, dur: s.dur, stops: s.stops.map((p) => p.at) })), steps: steps.map((p) => ({ i: p.i, at: p.at })),
  };
  chrome();
  requestAnimationFrame(loop);
  if (RM) go(0);
  else play([[0, 0, steps[0].at]]);
})().catch((e) => {
  const l = document.getElementById("loading");
  if (l) l.textContent = "読み込めませんでした: " + e.message;
  console.error(e);
});
</script>
</body>
</html>
