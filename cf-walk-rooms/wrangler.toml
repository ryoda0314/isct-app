# 「みんなと歩く」の部屋サーバー（Cloudflare Workers + Durable Objects。無料プランで動く形）
# 手元で動かす：npx wrangler dev（このフォルダで）  公開：npx wrangler deploy（ユーザーの OK のあと）
name = "isct-walk-rooms"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "WalkRoom"

# 無料プランの Durable Objects は SQLite の入れ物だけ
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WalkRoom"]

[vars]
# つないでよいページの出どころ（カンマ区切り）。手元の開発サーバーも入れる
ALLOWED_ORIGINS = "https://sciencetokyo.app,http://localhost:3000,http://localhost:3123"
MAX_PEERS = "40"
