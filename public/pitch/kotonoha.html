<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ことのは PBC 2026 ピッチ</title>
<!--
  PBC 2026 の5分ピッチ（日英併記）: 英語学習アプリ「ことのは」（仮称）。english-learning-system.md（設計案 v0.4）より。
  会場で読めるように: 読ませる文字は1920幅で28px以上（本文は40〜56px）、1枚に置くものは4つほどまで。画面は大きな吹き出しだけで見せる。
  例は1本だけを通す: 「I 今日は出かける気分じゃない」→ 直る → まとめ（feel like）→ 自分の文 → 数日後にまた出会う → 見本なしで言えた。
  課題のすぐあとに ターゲット（設計案の対象: 中高で学び、読めばわかるが、話す・書くで使える範囲がせまい大学生）を1枚で示す。
  聞き手は ことのあめ を知らないので、これまで の1枚で、去年のPBCの試作・ひとりで3か月作ったもの・ことのあめ（開発中）を
  画面写真で並べて紹介し、その上に ことのは を作ると見せる。
  ちがい は、よくあるAIチャットの画面（製品名やロゴは出さない）で、送るたびに前のやりとりが上へ流れて消えるのを見せる。
  ことのは側はシステムの動きをそのまま描く: 言えなかったところとフレーズを記録し、数日後に別の場面の会話で相手のセリフとして出す。
  再生のしくみは PBC2026_提案スライド と同じ（1枚が1場面、render(t) で t 秒目を描き、stops ごとに待つ）。
  操作: → / スペース / クリックで次へ、← / 左端クリックで戻る、F 全画面、N 発表メモ、Home 最初から。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Shippori+Mincho:wght@700&display=block">
<style>
/* Layout: a 1920×1080 stage scaled to the window. One idea per slide, drawn large: big chat bubbles for the app,
   big cards, a ring, stairs. Headings are Japanese with an English line; everything meant to be read is 28px or
   more. One light look on purpose: paper and ink, one blue accent, violet for what you meet again, and the
   colours of the falling sky only on the first and last slide. */
:root {
  --paper: #fcfbf8;
  --surface: #f1f4f8;
  --ink: #172033;
  --ink-2: #3b4558;
  --muted: #5c6578;
  --faint: #8c94a5;
  --line: #e4e7ec;
  --line-2: #d4d9e1;
  --accent: #0a64f0;
  --tint: #e6f0ff;
  --again: #6a4fe0;
  --again-tint: #efebff;
  --rain-blue: #0470fd;
  --rain-sky: #4ea7fd;
  --rain-violet: #a792fa;
  --rain-pink: #e79dfa;
  --rain-peach: #fec9a8;
  --on-accent: #ffffff;

  --font-ja: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-en: "IBM Plex Sans", "IBM Plex Sans JP", "Helvetica Neue", sans-serif;
  --font-mincho: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  color-scheme: light;
}
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
body { -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; cursor: default; }
#viewport {
  position: fixed; background: var(--paper);
  inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
  background: var(--paper); color: var(--ink); font-family: var(--font-ja); word-break: auto-phrase; line-break: strict;
}
#tick { position: fixed; inset: 0; pointer-events: none; background: var(--paper); opacity: 0.001; will-change: opacity; }
.scene { position: absolute; inset: 0; overflow: hidden; }
.inner { position: absolute; inset: 0; will-change: transform, opacity; }

#ui { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
#prog { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--surface); }
#progFill { position: absolute; inset: 0; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); transition: transform 0.5s ease; }
#pageNo { position: absolute; right: 48px; bottom: 24px; font-size: 22px; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
#hint { position: absolute; left: 48px; bottom: 24px; font-size: 22px; color: var(--faint); transition: opacity 1s; }
#loading { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--paper); font-size: 30px; font-weight: 600; color: var(--faint); }
#notesBar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; max-height: 40%; overflow: auto;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--paper); border-top: 1px solid var(--line-2); color: var(--ink); font: 500 16px/1.7 var(--font-ja);
}
#notesBar b { display: block; font-size: 13px; color: var(--muted); }

.en { font-family: var(--font-en); }
.abs { position: absolute; }
.v { will-change: transform, opacity; }
.ov { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
.ic { display: block; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }

/* A slide's heading: the part of the talk, the Japanese title, its English. */
.head { position: absolute; left: 120px; top: 64px; width: 1680px; }
.kick { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; white-space: nowrap; }
.kick::before { content: ""; width: 6px; height: 30px; border-radius: 3px; background: var(--accent); }
.title { margin: 12px 0 0; font-size: 64px; line-height: 1.25; font-weight: 700; letter-spacing: -0.005em; white-space: nowrap; }
.en-t { margin: 6px 0 0; font-family: var(--font-en); font-size: 32px; line-height: 1.3; font-weight: 500; color: var(--muted); white-space: nowrap; }
/* The one line a slide adds. */
.cap { margin: 0; display: flex; align-items: center; gap: 20px; font-size: 40px; line-height: 1.3; font-weight: 700; white-space: nowrap; }
.cap::before { content: ""; flex: none; width: 7px; height: 84px; border-radius: 4px; background: var(--accent); }
.cap small { display: block; font-family: var(--font-en); font-size: 28px; font-weight: 500; color: var(--muted); }

/* Title and the end: a sky of rain and leaves (言の葉). */
.rainfield { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.wordmark { margin: 0; font-family: var(--font-mincho); font-weight: 700; font-size: 150px; line-height: 1.15; letter-spacing: 0.06em; white-space: nowrap; }
.wordmark > span { display: inline-block; }
.wordmark .kanji { margin-left: 30px; font-size: 44px; letter-spacing: 0.08em; color: var(--muted); }
.lead { margin: 0; font-size: 48px; line-height: 1.5; font-weight: 600; white-space: nowrap; }
.lead-en { margin: 0; font-family: var(--font-en); font-size: 32px; line-height: 1.45; font-weight: 500; color: var(--muted); white-space: nowrap; }
.wm2 { font-family: var(--font-mincho); font-size: 64px; font-weight: 700; letter-spacing: 0.06em; white-space: nowrap; }
.wm2 span { margin-left: 18px; font-size: 30px; color: var(--muted); }
.endq { margin: 0; font-size: 92px; line-height: 1.3; font-weight: 700; white-space: nowrap; }
.ende { margin: 0; font-family: var(--font-en); font-size: 50px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.cta { margin: 0; font-size: 38px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.cta small { display: block; margin-top: 6px; font-family: var(--font-en); font-size: 30px; font-weight: 500; color: var(--muted); }

/* People, what they say and think. */
.ink { fill: var(--paper); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.fig svg { display: block; }
.floor { height: 3px; background: var(--line-2); }
.say { position: absolute; padding: 22px 34px; background: var(--surface); border-radius: 34px 34px 34px 12px; font-size: 42px; line-height: 1.35; font-weight: 500; white-space: nowrap; will-change: transform, opacity; }
.say.r { border-radius: 34px 34px 12px 34px; }
.say.kid { background: var(--paper); border: 3px solid var(--line-2); }
.dots { display: inline-flex; gap: 14px; padding: 16px 8px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--faint); }
.cloud { border: 3px solid var(--ink); border-radius: 60px; background: var(--paper); transform-origin: 60% 100%; }
.cloud i { position: absolute; border: 3px solid var(--ink); border-radius: 50%; background: var(--paper); }
.cloud .t1 { width: 30px; height: 30px; left: 410px; bottom: -50px; }
.cloud .t2 { width: 18px; height: 18px; left: 440px; bottom: -84px; }
.wcard { position: absolute; width: 200px; height: 90px; display: grid; place-items: center; box-sizing: border-box; border-radius: 16px; background: var(--surface); will-change: transform, opacity; }
.wcard b { font-family: var(--font-en); font-size: 40px; font-weight: 600; white-space: nowrap; }
.tag3 { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.tag3 small { margin-left: 6px; font-family: var(--font-en); font-size: 28px; font-weight: 500; color: var(--muted); }
.tag3.bad { color: var(--muted); }

/* Target: who it is for, and the gap between the English they understand and the English they can use. */
.who2 { text-align: center; }
.who2 b { display: block; font-size: 44px; line-height: 1.3; font-weight: 700; white-space: nowrap; }
.who2 small { display: block; font-family: var(--font-en); font-size: 28px; color: var(--muted); white-space: nowrap; }
.who2 span { display: block; margin-top: 16px; font-size: 32px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.blab b { font-size: 38px; font-weight: 700; white-space: nowrap; }
.blab small { margin-left: 14px; font-family: var(--font-en); font-size: 28px; color: var(--muted); white-space: nowrap; }
.bar { height: 60px; box-sizing: border-box; border-radius: 12px; transform-origin: 0 50%; }
.bar.know { background: var(--line-2); }
.bar.use { background: var(--accent); }
.bar.more { border: 3px dashed var(--accent); background: var(--tint); }
.grow2 { font-size: 34px; line-height: 1.25; font-weight: 700; color: var(--accent); white-space: nowrap; }
.grow2 small { display: block; font-family: var(--font-en); font-size: 28px; font-weight: 500; color: var(--muted); }

/* Big cards and the loop. */
.bigcard { width: 520px; height: 540px; box-sizing: border-box; padding: 48px; border: 3px solid var(--line-2); border-radius: 30px; background: var(--paper); display: flex; flex-direction: column; color: var(--accent); }
.bigcard b { margin-top: 30px; font-size: 64px; line-height: 1.2; font-weight: 700; color: var(--ink); white-space: nowrap; }
.bigcard small { font-family: var(--font-en); font-size: 32px; font-weight: 600; color: var(--muted); }
.bigcard span { margin-top: 42px; font-size: 34px; line-height: 1.4; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.bigcard em { margin-top: 6px; font-style: normal; font-family: var(--font-en); font-size: 28px; color: var(--muted); white-space: nowrap; }
.ringarc { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; }
.ringarc.again { stroke: var(--again); }
.ndot { fill: var(--accent); stroke: var(--paper); stroke-width: 5; }
.ndot.again { fill: var(--again); }
.rlab b { display: block; font-size: 38px; line-height: 1.3; font-weight: 700; white-space: nowrap; }
.rlab small { display: block; font-family: var(--font-en); font-size: 28px; color: var(--muted); white-space: nowrap; }
.rlab.again b { color: var(--again); }

/* The app, as large chat bubbles: yours on the right, the other side's on the left. */
.who { font-size: 30px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.who .en { font-weight: 500; }
.bub { box-sizing: border-box; padding: 18px 36px; font-family: var(--font-en); font-size: 56px; line-height: 1.35; white-space: nowrap; will-change: transform, opacity; }
.bub.sm { padding: 14px 28px; font-size: 40px; }
.bub.me { border: 3px solid var(--line-2); background: var(--paper); border-radius: 36px 36px 12px 36px; }
.bub.ai { background: var(--surface); border-radius: 36px 36px 36px 12px; }
.bub.fix { border: 3px solid var(--accent); background: var(--paper); border-radius: 36px; }
.jp { font-family: var(--font-ja); font-size: 0.88em; border: 3px dashed var(--accent); border-radius: 12px; padding: 0 10px; margin: 0 4px; }
.rp, .vk { border-radius: 10px; padding: 0 6px; margin: 0 -6px; font-weight: 600; }
.rp.lit { background: var(--tint); color: var(--accent); }
.caret { display: inline-block; width: 4px; height: 0.9em; margin-left: 6px; vertical-align: -0.1em; border-radius: 2px; background: var(--accent); }
.link { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; }
.linktip { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.badge4 { padding: 8px 22px; border-radius: 14px; background: var(--again-tint); color: var(--again); font-size: 34px; font-weight: 700; white-space: nowrap; }
.badge4 .en { font-weight: 500; }
.phchip { padding: 12px 30px; border: 3px solid var(--accent); border-radius: 999px; background: var(--tint); color: var(--accent); font-family: var(--font-en); font-size: 46px; font-weight: 700; white-space: nowrap; }
.note { box-sizing: border-box; padding: 44px 48px; border: 3px solid var(--line-2); border-radius: 30px; background: var(--paper); }
.nh2 { font-size: 42px; font-weight: 700; white-space: nowrap; }
.nh2 small { display: block; font-family: var(--font-en); font-size: 28px; font-weight: 500; color: var(--muted); }
.gap2 { margin-top: 48px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.gap2 .jp { font-size: 42px; margin: 0; }
.gap2 i { font-style: normal; font-size: 44px; line-height: 1; color: var(--faint); margin-left: 28px; }
.gap2 b { font-family: var(--font-en); font-size: 44px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.phbig { margin-top: 52px; }
.phbig b { display: inline-block; padding: 12px 30px; border-radius: 999px; background: var(--tint); color: var(--accent); font-family: var(--font-en); font-size: 54px; font-weight: 700; white-space: nowrap; }
.phbig small { display: block; margin-top: 16px; font-size: 30px; font-weight: 600; color: var(--muted); }
.phbig small .en { font-weight: 500; }
.phex { margin-top: 30px; font-family: var(--font-en); font-size: 34px; color: var(--ink-2); white-space: nowrap; }

/* Stairs of growth. */
.stair2 { width: 600px; height: 116px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 32px; border: 3px solid var(--line-2); border-radius: 20px; background: var(--paper); }
.stair2 b { font-size: 40px; font-weight: 700; white-space: nowrap; }
.stair2 small { font-family: var(--font-en); font-size: 28px; color: var(--muted); white-space: nowrap; }
.stair2.future { border-style: dashed; }
.tok2 { padding: 8px 24px; border-radius: 999px; background: var(--again); color: var(--on-accent); font-family: var(--font-en); font-size: 34px; font-weight: 700; white-space: nowrap; will-change: transform, opacity; }

/* Two columns: chatting, and keeping the gaps. */
.colh { font-size: 42px; font-weight: 700; white-space: nowrap; }
.colh small { display: block; font-family: var(--font-en); font-size: 28px; font-weight: 500; color: var(--muted); }
.colh.me { color: var(--accent); font-family: var(--font-mincho); letter-spacing: 0.06em; }
.colh.me small { letter-spacing: 0; font-family: var(--font-en); }
/* A plain AI chat to compare with: your messages in grey on the right, replies streaming in as text, and each
   message you send scrolling the last exchange up out of view. No product's name or logo. */
.gpt { box-sizing: border-box; display: flex; flex-direction: column; border: 3px solid var(--line-2); border-radius: 30px; background: var(--paper); overflow: hidden; }
.gbar { flex: none; height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; border-bottom: 2px solid var(--line); color: var(--muted); }
.gview { position: relative; flex: 1; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 44px); mask-image: linear-gradient(to bottom, transparent 0, #000 44px); }
.gtrack { position: absolute; left: 0; right: 0; top: 0; padding: 20px 40px 0 32px; display: flex; flex-direction: column; gap: 22px; will-change: transform; }
.gm { font-family: var(--font-en); font-size: 32px; line-height: 1.45; }
.gm.u { align-self: flex-end; max-width: 82%; padding: 12px 26px; border-radius: 28px; background: var(--surface); white-space: nowrap; will-change: transform, opacity; }
.gm .w { visibility: hidden; }
.gm .fx { border-radius: 8px; padding: 0 4px; margin: 0 -4px; font-weight: 700; }
.gthumb { position: absolute; right: 10px; top: 0; width: 6px; height: 0; border-radius: 3px; background: var(--line-2); }
.ginput { flex: none; margin: 14px 24px 18px; height: 68px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 28px; border: 2px solid var(--line-2); border-radius: 34px; font-size: 28px; color: var(--faint); white-space: nowrap; }
.gsend { width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
/* Kotonoha's side: what the system does with the gap. Today's chat → the record (the gap and the phrase that
   fills it) → a chat days later, where the phrase comes back in the other person's line. */
.sys { box-sizing: border-box; padding: 14px 18px 12px; border: 3px solid var(--line-2); border-radius: 22px; background: var(--paper); }
.sys.rec { border-color: var(--accent); }
.sys .lg { position: absolute; left: 16px; top: -19px; padding: 0 10px; background: var(--paper); font-size: 28px; line-height: 34px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.sys .lg small { margin-left: 8px; font-family: var(--font-en); font-size: 28px; font-weight: 500; color: var(--muted); }
.sys.rec .lg { color: var(--accent); }
.sb { display: inline-block; padding: 8px 22px; border-radius: 24px; background: var(--surface); font-family: var(--font-en); font-size: 28px; line-height: 1.35; white-space: nowrap; }
.sb .jp { font-size: 1em; margin: 0 2px; }
.sb .vk { margin: 0 -4px; padding: 0 4px; border-radius: 8px; }
.rrow { display: flex; align-items: center; gap: 12px; height: 54px; white-space: nowrap; }
.rrow .slot { font-size: 28px; margin: 0; visibility: hidden; }
.rrow .ar { font-size: 32px; color: var(--faint); }
.rrow .pill { padding: 3px 18px; border-radius: 999px; background: var(--tint); color: var(--accent); font-family: var(--font-en); font-size: 28px; font-weight: 700; will-change: transform, opacity; }
.flow { display: flex; align-items: center; gap: 14px; height: 44px; color: var(--accent); white-space: nowrap; }
.flow b { font-size: 30px; font-weight: 700; }
.flow small { font-family: var(--font-en); font-size: 28px; font-weight: 500; color: var(--muted); }
.flow.again { color: var(--again); }
.ftok { position: absolute; left: 0; top: 0; padding: 3px 18px; border-radius: 999px; background: var(--again); color: var(--on-accent); font-family: var(--font-en); font-size: 28px; font-weight: 700; white-space: nowrap; will-change: transform, opacity; }
.fly { position: absolute; left: 0; top: 0; margin: 0; transform-origin: 0 0; will-change: transform, opacity; }
.ccap { font-size: 38px; line-height: 1.35; font-weight: 700; white-space: nowrap; }
.ccap small { display: block; font-family: var(--font-en); font-size: 28px; font-weight: 500; color: var(--muted); }
.ccap.me { color: var(--accent); }

/* Ready parts, plan, team. */
/* So far: the two earlier products as greyed screenshots, then Kotonoame, then this proposal. */
.past { width: 382px; }
.past .shot { width: 382px; height: 239px; box-sizing: border-box; border: 3px solid var(--line-2); border-radius: 18px; overflow: hidden; background: var(--surface); }
.past .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
.past.old .shot img { filter: grayscale(1); opacity: 0.75; }
.past.now .shot { border-color: var(--accent); }
.past.next .shot { display: grid; place-items: center; border: 3px dashed var(--accent); background: var(--paper); }
.past .wm3 { font-style: normal; font-family: var(--font-mincho); font-size: 60px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); }
.past b { display: block; margin-top: 22px; font-size: 32px; line-height: 1.3; font-weight: 700; white-space: nowrap; }
.past.now b, .past.next b { color: var(--accent); }
.past small { display: block; margin-top: 4px; font-family: var(--font-en); font-size: 28px; line-height: 1.3; color: var(--muted); white-space: nowrap; }
.past span { display: block; margin-top: 12px; font-size: 28px; line-height: 1.45; font-weight: 600; color: var(--ink-2); }
.parr { font-size: 52px; line-height: 1; color: var(--faint); }
.past .shot { height: 220px; }
/* The lesson under the cards: what exploded in the first two, and the one loop the third keeps to. */
.band b { display: block; font-size: 34px; line-height: 1.3; font-weight: 700; white-space: nowrap; }
.band small { display: block; font-family: var(--font-en); font-size: 28px; line-height: 1.3; font-weight: 500; color: var(--muted); white-space: nowrap; }
.band.boom b { color: var(--ink-2); }
.band.one b { color: var(--accent); }
.cloud2 { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.cloud2 span { padding: 3px 14px; border: 2px solid var(--line-2); border-radius: 999px; background: var(--paper); font-size: 28px; font-weight: 600; color: var(--ink-2); white-space: nowrap; transform-origin: 0 0; will-change: transform, opacity; }
.count2 { font-family: var(--font-en); font-size: 64px; line-height: 1; font-weight: 700; color: var(--ink); white-space: nowrap; }
.count2 small { margin-left: 4px; font-family: var(--font-ja); font-size: 30px; font-weight: 700; color: var(--ink-2); }
.lp { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.lp span { padding: 6px 18px; border-radius: 999px; background: var(--tint); color: var(--accent); font-size: 30px; font-weight: 700; }
.lp span.again { background: var(--again-tint); color: var(--again); }
.lp i { font-style: normal; font-size: 34px; color: var(--faint); }
.rule2 { font-size: 32px; font-weight: 700; white-space: nowrap; }
.rule2 small { display: block; font-family: var(--font-en); font-size: 28px; font-weight: 500; color: var(--muted); }
.tl2 { height: 4px; background: var(--ink-2); transform-origin: 0 50%; }
.mdot { position: absolute; width: 28px; height: 28px; box-sizing: border-box; border: 5px solid var(--paper); border-radius: 50%; background: var(--accent); }
.ms2 .d { font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ms2 .e { font-size: 32px; line-height: 1.4; font-weight: 600; white-space: nowrap; }
.ms2 small { display: block; font-family: var(--font-en); font-size: 28px; color: var(--muted); white-space: nowrap; }
.ghost { fill: var(--paper); stroke: var(--faint); stroke-width: 3; stroke-dasharray: 7 7; stroke-linejoin: round; }
.plus { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
.role2 { text-align: center; }
.role2 b { display: block; font-size: 36px; font-weight: 700; white-space: nowrap; }
.role2 small { display: block; margin-top: 4px; font-family: var(--font-en); font-size: 28px; color: var(--muted); white-space: nowrap; }
.role2.me b { color: var(--accent); }
</style>

  // Typing a sentence: parts flagged 1 are still Japanese (a dashed box), 2 are the phrase being tried (lit).

  // A sky of fine rain with leaves (言の葉) drifting down among the drops.
  function rng(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    const cv = el(parent, '<canvas class="rainfield" width="1920" height="1080"></canvas>');

    const r = rng(seed);
    const drops = Array.from({ length: 80 }, () => {

          const x = l.x + Math.sin(s * l.f + l.p) * l.sw;

    init(inner) {
      this.h = head(inner, "PBCでやること / In PBC", "1本の流れを作って、確かめる", "Build one loop, then test it");
      this.tl = el(inner, '<div class="tl2 abs" style="left:160px;top:470px;width:1600px"></div>');
      const MS = [
        ["10/21・11/4", "ピッチ・チーム", "Pitch, team"],
        ["11月", "話を聞く・画面の試作", "Interviews, mockups"],
        ["12/12", "開発1日目", "Dev day 1"],
        ["12/18〜20", "合宿で作って試す", "Camp: build and test"],
      ];
      this.ms = MS.map((m, i) => {
        const x = 200 + i * 420;
        return [
          el(inner, `<i class="mdot" style="left:${x - 14}px;top:${472 - 14}px;transform:scale(0)"></i>`),
          el(inner, `<div class="ms2 abs v" style="left:${x - 14}px;top:384px"><div class="d">${m[0]}</div></div>`),
          el(inner, `<div class="ms2 abs v" style="left:${x - 14}px;top:510px"><div class="e">${m[1]}</div><small>${m[2]}</small></div>`),
        ];
      });
      this.cap = el(inner, '<p class="cap abs v" style="left:120px;top:760px"><span>見本なしで言える場面が、増えるか<small>The test: do replies without a model grow?</small></span></p>');
    },
    render(t) {
      headVis(this.h, t);
      this.tl.style.transform = `scaleX(${eo(seg(t, 0.3, 1.1)).toFixed(4)})`;
      this.ms.forEach((m, i) => {
        const a = 0.4 + i * 0.22;
        m[0].style.transform = `scale(${eo(seg(t, a, a + 0.3)).toFixed(3)})`;
        vis(m[1], t, a + 0.05, { dx: 0, dy: 12 });
        vis(m[2], t, a + 0.12, { dx: 0, dy: -12 });
      });
      vis(this.cap, t, 1.6);
    },
  });

  scene("team", {
    name: "チーム",
    stops: [[2.1, "いまは、わたしひとりです。エンジニア、デザイナー、英語の監修、ユーザー調査。この4つの役割で仲間を探しています。英語が得意な人や留学生も、大歓迎です。"]],
    init(inner) {
      this.h = head(inner, "チーム / Team", "ひとりです。仲間を探しています", "Solo for now, looking for teammates");
      const cx = (i) => 288 + i * 336;
      const R = [["エンジニア", "Engineer"], ["デザイナー", "Designer"], ["英語の監修", "English reviewer"], ["ユーザー調査", "User research"]];
      this.me = el(inner, `<div class="fig abs v" style="left:${cx(0) - 75}px;top:330px">${ADULT(150, 180)}</div>`);
      this.meL = el(inner, `<div class="role2 me abs v" style="left:${cx(0) - 160}px;top:540px;width:320px"><b>わたし</b><small>Me</small></div>`);
      this.seats = R.map((r, i) => ({
        fig: el(inner, `<div class="fig abs" style="left:0;top:0">${GHOST}</div>`),
        x: cx(i + 1) - 75,
        label: el(inner, `<div class="role2 abs v" style="left:${cx(i + 1) - 160}px;top:540px;width:320px"><b>${r[0]}</b><small>${r[1]}</small></div>`),
      }));
      this.cap = el(inner, '<p class="cap abs v" style="left:120px;top:780px"><span>英語が得意な人・留学生も大歓迎<small>Fluent speakers and international students welcome</small></span></p>');
    },
    render(t) {
      headVis(this.h, t);
      vis(this.me, t, 0.3, { dx: 0, dy: 14 });
      vis(this.meL, t, 0.4);
      this.seats.forEach((s, i) => {
        const a = 0.7 + i * 0.2;
        const k = eob(seg(t, a, a + 0.4), 1.2);
        s.fig.style.transform = `translate(${s.x}px,330px) scale(${(0.85 + 0.15 * k).toFixed(3)})`;
        s.fig.style.opacity = clamp01(k * 2).toFixed(3);
        vis(s.label, t, a + 0.1, { dx: 0, dy: 10 });
      });
      vis(this.cap, t, 1.6);
    },
  });

  scene("end", {
    name: "おわり",
    stops: [[1.6, "興味があれば、このあと声をかけてください。ありがとうございました。"]],
    init(inner) {
      this.sky = skyField(inner, 13, 1180);
      this.wm = el(inner, '<div class="wm2 abs v" style="left:120px;top:250px">ことのは<span>言の葉</span></div>');
      this.q = el(inner, '<p class="endq abs v" style="left:116px;top:390px">一緒に作りませんか？</p>');
      this.qe = el(inner, '<p class="ende abs v" style="left:120px;top:520px">Want to build it together?</p>');
      this.cta = el(inner, '<p class="cta abs v" style="left:120px;top:680px">このあと、声をかけてください<small>Come talk to me after the session</small></p>');
    },
    render(t) {
      this.sky.canvas.style.opacity = eo(seg(t, 0, 1.2)).toFixed(3);
      vis(this.wm, t, 0.1);
      vis(this.q, t, 0.3);
      vis(this.qe, t, 0.5);
      vis(this.cta, t, 0.8);
    },
    idle(now) { this.sky.draw(now); },
  });

  // ---- Load: build every scene, wait for the faces, then measure ---------------------------------
  const loading = document.getElementById("loading");
  const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
  const scenes = SCENES.map((def) => {
    const box = document.createElement("div");
    box.className = "scene";
    const inner = document.createElement("div");
    inner.className = "inner";
    box.appendChild(inner);
    stage.insertBefore(box, ui);
    const stops = def.stops.map(([at, note]) => ({ at, note }));
    def.out = stops[stops.length - 1].at;
    def.init(inner, box);
    return { def, box, inner, stops, out: def.out, dur: def.out + 0.5, name: def.name };
  });
  stage.querySelectorAll(".en, .en-t, .lead-en, .ende, .bub, .gm, .sb, .ftok, .wcard, .phchip, .phbig b, .phex, .tok2").forEach((n) => (n.lang = "en"));
  stage.querySelectorAll(".jp").forEach((n) => (n.lang = "ja"));
  void stage.offsetHeight;
  await frame();
  await frame();
  await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 4000))]);
  for (const s of scenes) {
    if (s.def.measure) s.def.measure();
    s.def.render(0);
    s.box.style.display = "none";
    s.box.setAttribute("aria-hidden", "true");
  }
  loading.remove();

  // ---- Playback: each press plays on to the next stop ------------------------------------------------
  const N = scenes.length;
  const steps = [];
  scenes.forEach((s, i) => s.stops.forEach((p, k) => steps.push({ i, k, at: p.at, note: p.note })));
  const S = steps.length;
  let cur = 0, shown = -1, queue = [], segStart = 0, tickOn = false;
  const tickEl = document.getElementById("tick");
  function show(i) {
    if (shown === i) return;
    scenes.forEach((s, k) => { s.box.style.display = k === i ? "" : "none"; s.box.setAttribute("aria-hidden", k === i ? "false" : "true"); });
    shown = i;
  }
  // A slide's parts in .inner leave together, fading to the left, before the cut.
  function draw(i, t) {
    show(i);
    const s = scenes[i];
    s.def.render(t);
    const q = eio(seg(t, s.out, s.out + 0.45));
    s.inner.style.opacity = (1 - q).toFixed(3);
    s.inner.style.transform = q > 0 ? `translateX(${(-34 * q).toFixed(1)}px)` : "";
  }
  // One loop for the deck: it plays the queue and lets the shown slide keep its sky, dots and caret moving
  // while the deck waits. While playing, an all but transparent layer changes every frame so the whole screen
  // is redrawn (a still part followed by a small change made some GPUs stall).
  function loop(now) {
    requestAnimationFrame(loop);
    if (queue.length) {
      if (!segStart) segStart = now;
      const [i, a, b] = queue[0];
      const t = a + (now - segStart) / 1000;
      if (t >= b) { draw(i, b); queue.shift(); segStart = now; }
      else draw(i, t);
      tickOn = !tickOn;
      tickEl.style.opacity = tickOn ? "0.0011" : "0.001";
    }
    const s = scenes[shown];
    if (s && s.def.idle) s.def.idle(now);
  }
  function play(run) { queue = run; segStart = 0; }
  function finish() {
    if (!queue.length) return;
    const [i, , b] = queue[queue.length - 1];
    queue = [];
    draw(i, b);
  }
  function go(k) {
    k = Math.max(0, Math.min(S - 1, k));
    queue = [];
    cur = k;
    draw(steps[k].i, steps[k].at);
    chrome();
  }
  function next() {
    if (queue.length) { finish(); return; }
    if (cur >= S - 1) return;
    hideHint();
    if (RM) { go(cur + 1); return; }
    const a = steps[cur], b = steps[cur + 1];
    if (a.i === b.i) play([[a.i, a.at, b.at]]);
    else play([[a.i, a.at, scenes[a.i].dur], [b.i, 0, b.at]]);
    cur += 1;
    chrome();
  }
  function back() { finish(); go(cur - 1); }
  function chrome() {
    document.getElementById("progFill").style.transform = `scaleX(${S > 1 ? cur / (S - 1) : 1})`;
    document.getElementById("pageNo").textContent = `${steps[cur].i + 1} / ${N}`;
    renderNotes();
  }
  const hint = document.getElementById("hint");
  hint.textContent = matchMedia("(pointer: coarse)").matches ? "タップで次へ　左端で戻る" : "→ / クリックで次へ　F 全画面　N 発表メモ";
  function hideHint() { hint.style.opacity = 0; }
  setTimeout(hideHint, 9000);

  addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter" || k === "ArrowDown") { e.preventDefault(); next(); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace" || k === "ArrowUp") { e.preventDefault(); back(); }
    else if (k === "Home") { go(0); if (!RM) play([[0, 0, steps[0].at]]); }
    else if (k === "End") go(S - 1);
    else if (k === "f" || k === "F") { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else document.documentElement.requestFullscreen().catch(() => {}); }
    else if (k === "n" || k === "N") openNotes();
  });
  vp.addEventListener("click", (e) => { if (e.target.closest("#notesBar")) return; if (e.clientX < innerWidth * 0.2) back(); else next(); });

  // ---- Talk track: a second window, or a strip under the slide where windows cannot open -----------
  let notesWin = null, startedAt = 0;
  const bar = document.getElementById("notesBar");
  function openNotes() {
    let w = null;
    try { w = window.open("", "pbc-kotonoha-notes", "width=640,height=760"); } catch (err) { w = null; }
    if (!w) { bar.hidden = !bar.hidden; renderNotes(); return; }
    notesWin = w;
    const d = w.document;
    d.open();
    d.write(`<!doctype html><html lang="ja"><meta charset="utf-8"><title>発表メモ</title>
<style>body{margin:0;padding:28px 32px;font-family:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",sans-serif;color:#172033;background:#fcfbf8}
#p{font-size:15px;color:#5c6578;font-weight:700}#n{font-size:26px;line-height:1.7;margin-top:10px;font-weight:500}
#x{font-size:16px;line-height:1.7;color:#5c6578;margin-top:24px;border-top:1px solid #e4e7ec;padding-top:14px}
#tm{position:fixed;right:28px;top:24px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.k{position:fixed;left:32px;bottom:20px;font-size:13px;color:#8c94a5}</style>
<div id="p"></div><div id="tm">0:00</div><div id="n"></div><div id="x"></div><div class="k">← → でこちらからも進めます</div>`);
    d.close();
    d.addEventListener("keydown", (e) => {
      if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
      if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); back(); }
    });
    renderNotes();
  }
  function renderNotes() {
    const st = steps[cur], sc = scenes[st.i];
    const where = `${st.i + 1} / ${N}　${sc.name}` + (sc.stops.length > 1 ? `（${st.k + 1}/${sc.stops.length}）` : "");
    if (cur > 0 && !startedAt) startedAt = Date.now();
    if (!bar.hidden) {
      bar.textContent = "";
      const b = document.createElement("b");
      b.textContent = where;
      bar.append(b, st.note);
    }
    if (!notesWin || notesWin.closed) return;
    const d = notesWin.document;
    if (!d.getElementById("n")) return;
    d.getElementById("p").textContent = where;
    d.getElementById("n").textContent = st.note;
    d.getElementById("x").textContent = cur + 1 < S ? `次：${steps[cur + 1].note}` : "おわり";
  }
  setInterval(() => {
    if (!notesWin || notesWin.closed || !startedAt) return;
    const s = Math.floor((Date.now() - startedAt) / 1000);
    const n = notesWin.document.getElementById("tm");
    if (n) n.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 500);

  // For checks: draw(i, t) shows scene i at its second t; go(k) shows stop k.
  window.__deck = {
    next, go, draw, get cur() { return cur; }, get playing() { return queue.length > 0; },
    scenes: scenes.map((s) => ({ id: s.def.id, dur: s.dur, stops: s.stops.map((p) => p.at) })), steps: steps.map((p) => ({ i: p.i, at: p.at })),
  };
  chrome();
  requestAnimationFrame(loop);
  if (RM) go(0);
  else play([[0, 0, steps[0].at]]);
})().catch((e) => {
  const l = document.getElementById("loading");
  if (l) l.textContent = "読み込めませんでした: " + e.message;
  console.error(e);
});
</script>
</body>
</html>
