<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173e39">
  <title>部品配置図｜迎えに来るUSBポート</title>
  <style>:root {
  color-scheme: light;
  --ink: #1e3330;
  --green: #09675d;
  --deep: #173e39;
  --muted: #526660;
  --rule: #c7d1c8;
  --soft: #e2e8df;
  --paper: #f7f8f3;
  --orange: #985321;
  --mono: "Bahnschrift", "Consolas", "Courier New", monospace;
  font-family: "Yu Gothic UI", "BIZ UDPGothic", "Meiryo", system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
}
* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; }
button, select { font: inherit; color: inherit; }
button, a, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid #b76b27; outline-offset: 3px; }
.shell { width: min(1472px, 100%); margin-inline: auto; padding-inline: clamp(18px, 3.7vw, 70px); }
.mast { background: var(--deep); color: #f7fcf6; }
.mast-inner { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.brand, .file-link { display: inline-flex; align-items: center; text-decoration: none; }
.brand { gap: 11px; font-weight: 700; font-size: 17px; letter-spacing: .025em; }
.brand-icon { position: relative; display: grid; place-items: center; width: 33px; height: 31px; border: 1px solid #81a59b; border-radius: 7px; }
.brand-icon i { width: 20px; height: 11px; border: 1.8px solid #f1f8ef; border-radius: 2px; position: relative; }
.brand-icon i::after { content: ""; position: absolute; bottom: 1.5px; left: 3px; right: 3px; height: 2px; background: #8ed8c7; }
.file-link { gap: 8px; color: #f1f8f1; font-size: 13px; font-weight: 650; padding: 8px 0 8px 8px; }
.file-link:hover { text-decoration: underline; text-underline-offset: 4px; }
.sheet-icon { font: 21px/1 var(--mono); color: #c1e5d8; }
.ext { font: 12px/1.4 var(--mono); letter-spacing: .02em; color: #b3d4c8; }
.intro { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: clamp(12px, 1.7vh, 22px) 0 clamp(8px, 1.3vh, 19px); }
h1,h2,h3,p { margin: 0; }
h1 { font-size: clamp(32px, 3vw, 48px); font-weight: 740; letter-spacing: -.045em; line-height: 1.17; }
.intro p { margin-top: 4px; color: var(--muted); font-size: clamp(13px, 1.04vw, 16px); line-height: 1.55; }
.finder { flex: 0 1 262px; min-width: 190px; }
.finder label { display: block; font-size: 12px; font-weight: 680; color: var(--muted); margin-bottom: 5px; }
.finder select { width: 100%; height: 40px; padding: 0 29px 0 12px; background-color: #fff; border: 1px solid #9dafa3; border-radius: 5px; font-weight: 650; font-size: 14px; cursor: pointer; text-overflow: ellipsis; }
#views { display: flex; align-items: stretch; gap: clamp(12px,2.3vw,38px); border-bottom: 1px solid #9fb3a6; overflow-x: auto; scrollbar-width: thin; }
#views a { display: flex; align-items: center; gap: 7px; height: 39px; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 0 3px 3px; color: #52655d; text-decoration: none; white-space: nowrap; font-size: 15px; font-weight: 670; }
#views a:first-child { padding-left: 0; }
#views a[aria-current] { color: var(--green); border-color: var(--green); }
#views a:hover { color: var(--green); }
.tab-key { font: 600 12px/1 var(--mono); color: #60776d; }
.overview-icon { display: grid; grid-template: repeat(2,4px)/repeat(2,4px); gap: 2px; }
.overview-icon i { background: currentColor; }
.workspace { display: grid; grid-template-columns: minmax(0,2.16fr) minmax(300px,1fr); gap: clamp(17px,2.1vw,33px); align-items: start; padding-top: clamp(12px,1.55vh,24px); }
.figure-panel { min-width: 0; border: 1px solid #b9c8bb; border-radius: 9px; overflow: hidden; background: #fff; }
.figure-top { min-height: 45px; display: flex; align-items: center; gap: 12px; justify-content: space-between; padding: 7px clamp(14px,1.55vw,26px); border-bottom: 1px solid #dce5d9; }
.figure-name { display: flex; align-items: center; gap: 9px; }
.figure-name h2 { font-size: clamp(17px,1.38vw,23px); font-weight: 710; letter-spacing: -.02em; }
#figure-key { display: grid; place-items: center; font: 650 14px/1 var(--mono); color: var(--green); }
#figure-key:not(:empty) { border-left: 3px solid var(--green); padding-left: 8px; }
#view-mode { border: 1px solid #c9d5c9; background: #f5f8f2; color: #4c6358; padding: 3px 8px; border-radius: 3px; font-size: 11.5px; font-weight: 630; white-space: nowrap; }
#view-mode.optional { background: #fbf2e8; color: var(--orange); border-color: #e0bea0; }
#plot { position: relative; isolation: isolate; width: 100%; aspect-ratio: 17/10; max-height: max(280px,calc(100vh - 307px)); overflow: hidden;
  background-color: #f0f3eb;
  background-image: radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.27), transparent 74%), radial-gradient(#c7d2c4 .77px,transparent .95px);
  background-size: 100% 100%, 15px 15px;
}
#art,#tint,#leaders,#pins { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#projection { position: absolute; inset: 0; margin: auto; }
#art { object-fit: fill; user-select: none; }
#tint,#leaders,#pins { pointer-events: none; }
#leaders { overflow: visible; }
#leaders path { fill: none; stroke: #48766c; stroke-width: 1.32; stroke-linejoin: round; }
#leaders circle { fill: #0d776b; stroke: #f7fcf7; stroke-width: 1.5; }
#leaders .extra path { stroke: #ad6a3b; stroke-dasharray: 4 3; }
#leaders .extra circle { fill: #b36a36; }
#leaders .selected path { stroke: #17658f; stroke-width: 1.8; }
#leaders .selected circle { fill: #17658f; }
#leaders .subdued { opacity: .29; }
.pin { pointer-events: auto; position: absolute; transform: translateY(-50%); display: inline-flex; align-items: center; gap: 6px; min-height: 29px; padding: 2px 8px 2px 3px;
  border: 1px solid #a9bfb1; border-radius: 4px; background: #fbfdf8; color: #204c44; box-shadow: 0 1px 2px #1b3d2810; white-space: nowrap; font-size: clamp(13px,1.04vw,16px); font-weight: 700; }
.pin-key,.area-key,.row-num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pin-key { display: grid; place-items: center; min-width: 21px; height: 21px; padding: 0 3px; background: #176c5e; color: white; border-radius: 2px; font-size: 12px; }
.pin.extra { border-style: dashed; border-color: #b88a65; color: #7c491f; }
.pin.extra .pin-key { background: #975b30; }
.pin:hover,.pin:focus-visible,.pin.focused { border-color: #0a695a; box-shadow: 0 0 0 2px #22847122; }
.pin.extra.focused { border-color: #9e5727; }
.pin.focused { border-color: #17658f; color: #144d70; }
.pin.focused .pin-key { background: #17658f; }
.pin.subdued { opacity: .58; }
.figure-caption { border-top: 1px solid #dce5d9; padding: 10px clamp(14px,1.55vw,26px) 12px; line-height: 1.65; color: #394e43; font-size: clamp(13px,1.06vw,16px); min-height: 45px; }
.inspector { min-width: 0; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 2px solid #365d50; padding: 9px 0 12px; }
.side-head h2 { font-size: clamp(19px,1.45vw,24px); font-weight: 730; letter-spacing: -.03em; }
.side-meta { font-size: 12px; color: #5d7063; white-space: nowrap; }
.area-list,.part-list { list-style: none; padding: 0; margin: 0; }
.area-list li,.part-list li { border-bottom: 1px solid var(--rule); }
.area-link,.part-link { width: 100%; text-decoration: none; display: flex; align-items: center; gap: 12px; background: transparent; padding: 13px 4px; }
.area-link:hover,.part-link:hover { background: #e9efe5; }
.area-key { flex: 0 0 33px; height: 33px; display: grid; place-items: center; background: #e1eee2; color: #196354; border: 1px solid #b9cfc0; border-radius: 5px; font-size: 17px; font-weight: 640; }
.area-link.extra .area-key { background: #faecdc; color: var(--orange); border-color: #ddc5a9; }
.area-text { min-width: 0; flex: 1; }
.area-text strong { display: block; font-size: 16px; font-weight: 700; line-height: 1.5; }
.area-text small { display: block; margin-top: 1px; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
.chevron { margin-left: auto; flex: none; font-size: 19px; line-height: 1; color: #648071; padding-right: 3px; }
.part-link { gap: 8px; padding: 8px 2px; min-height: 37px; }
.row-num { display: inline-grid; place-items: center; border-radius: 3px; min-width: 26px; height: 21px; color: #315f50; background: #e4ede2; font-size: 12px; font-weight: 650; }
.part-link strong { font-size: 15px; font-weight: 650; }
.part-link .status { margin-left: auto; text-align: right; white-space: nowrap; font-size: 10.5px; color: #53685d; }
.status.opt { color: var(--orange); }
.part-link .chevron { margin: 0; font-size: 16px; }
.context-note { margin-top: 14px; padding: 10px 12px; border-left: 3px solid #9db5a8; background: #edf2e9; font-size: 12px; color: #40584b; line-height: 1.7; }
.context-note b { color: #2c493c; }
.back-link { display: inline-flex; align-items: center; gap: 5px; color: var(--green); font-size: 13px; text-decoration: none; font-weight: 670; padding: 7px 0; }
.back-link:hover,.cross-views a:hover,.page-foot a:hover { text-decoration: underline; }
.item-detail { padding: 11px 0 0; border-top: 2px solid #365d50; margin-top: 4px; }
.item-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #53675c; }
.item-status { border: 1px solid #afc6b7; border-radius: 3px; padding: 2px 6px; color: #315e48; font-size: 11px; }
.item-status.opt { color: var(--orange); background: #fcf0e4; border-color: #dfbea0; }
.item-detail h2 { font-size: clamp(20px,1.7vw,27px); font-weight: 710; line-height: 1.46; margin: 9px 0 10px; overflow-wrap: anywhere; letter-spacing: -.02em; }
.item-place { font-size: 15px; color: #374e42; line-height: 1.8; }
.specs { margin: 16px 0 0; font-size: 13px; border-top: 1px solid var(--rule); }
.specs div { display: grid; grid-template-columns: 69px 1fr; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
.specs dt { color: #5a6d60; font-size: 12px; }
.specs dd { margin: 0; font-weight: 650; line-height: 1.55; overflow-wrap: anywhere; }
.cross-views { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 12px; margin-top: 11px; font-size: 12px; color: #53695a; }
.cross-views a { color: var(--green); font-weight: 650; text-decoration: none; }
.page-foot { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; border-top: 1px solid var(--rule); padding: 12px 0 22px; margin-top: 21px; color: #586c5e; font-size: 12px; line-height: 1.6; }
.page-foot a { text-decoration: none; color: var(--green); white-space: nowrap; }
@media (min-width: 1500px) {
  .area-link { padding-block: 17px; }
  .area-text strong {font-size: 16px;}
  .area-text small,.part-link strong {font-size: 14px;}
}
@media (max-width: 900px) {
  .shell { padding-inline: 20px; }
  .workspace { grid-template-columns: minmax(0,1.75fr) minmax(240px,1fr); gap: 14px; }
  .area-link { gap: 8px; padding-block: 10px; }
  .area-key { flex-basis: 27px; height: 27px; }
  .area-text small { font-size: 11.5px; }
  .pin { gap: 3px; padding: 2px 4px 2px 2px; min-height: 23px; }
  .pin-key { min-width: 18px; height: 18px; }
}
@media (max-width: 720px) {
  .mast-inner { min-height: 51px; }
  .brand { font-size: 15px; gap: 7px; }
  .brand-icon { width: 28px; height: 27px; }
  .intro { align-items: flex-start; flex-direction: column; gap: 11px; padding: 16px 0 9px; }
  .intro p { margin-top: 3px; }
  .finder { flex: none; width: 100%; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .finder label { flex: none; margin: 0; font-size: 11px; }
  .finder select { flex: 1; min-width: 0; height: 34px; font-size: 13px; }
  #views { gap: 16px; }
  #views a { height: 39px; font-size: 13px; gap: 4px; }
  .workspace { grid-template-columns: minmax(0,1fr); gap: 11px; padding-top: 12px; }
  .figure-top { min-height: 42px; padding-block: 7px; }
  .figure-caption { padding-block: 9px; min-height: 0; }
  .area-link { padding-block: 10px; }
  .side-head { padding-top: 5px; }
  .part-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); column-gap: 14px; }
  .part-link .status { display: none; }
  .part-link .chevron { margin-left: auto; }
  .page-foot { margin-top: 16px; }
}
@media (max-width: 490px) {
  .shell { padding-inline: 13px; }
  .file-link { font-size: 12px; gap: 5px; }
  .figure-panel { border-radius: 6px; }
  .pin { padding: 1px 3px 1px 1px; font-size: 10px; gap: 2px; }
  .pin-key { min-width: 17px; height: 17px; font-size: 10px; }
  #plot.detail-view .pin:not(.focused) .pin-label { display: none; }
  #plot.detail-view .pin:not(.focused) { padding: 2px 3px; }
  #views { gap: 13px; }
  .part-link strong { font-size: 12px; }
}
@media print {
  body { background: white; }
  .mast { background: white; color: var(--ink); }
  .mast-inner { min-height: 35px; }
  .finder,.file-link,#views,.page-foot a,.back-link,.chevron { display: none; }
  .intro { padding-block: 14px; }
  .workspace { grid-template-columns: 1.8fr 1fr; padding-top: 0; }
  .shell { width: 100%; padding: 0; }
  .figure-panel,.inspector { break-inside: avoid; }
  * { print-color-adjust: exact; }
}
</style>
</head>

      readyMask=mask;canvas.width=mask.width;canvas.height=mask.height;paint();plot.setAttribute("aria-busy","false");
    }).catch(()=>{if(version===routeVersion)plot.setAttribute("aria-busy","false");});
    document.title=(part?usage[part][0]:area.title)+"｜部品配置図｜迎えに来るUSBポート";
    if(hadFocus && (view!==previous || oldPart!==part)) {
      const heading=inspector.querySelector("h2");heading.tabIndex=-1;heading.focus({preventScroll:true});
      if(matchMedia("(max-width:720px)").matches && plot.getBoundingClientRect().top<0) {
        byId("view-title").scrollIntoView({block:"start"});
      }
    }
  }
  findPart.addEventListener("change",()=>{
    const id=Number(findPart.value);
    location.hash=id?route(chosenView(id),id):route(view);
  });
  buildNavigation();addEventListener("hashchange",render);
  new ResizeObserver(drawLines).observe(plot);
  render();
  if(document.fonts)document.fonts.ready.then(drawLines);
})();
</script>
</body>
</html>
